name: Test and deploy D-Fence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  AZURE_WEBAPP_NAME: dfence-sc2006
  AZURE_RESOURCE_GROUP: dfence

jobs:
  workflow-lint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned release, verified against its published SHA-256 before it runs.
      - name: Run actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
          ./actionlint -color

  migration-guard:
    name: Check migrations are append-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail if a released migration was edited
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF_NAME: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE_REF="origin/${BASE_REF_NAME}"
          elif [ "$REF_NAME" = refs/heads/main ]; then
            BASE_REF="$BEFORE_SHA"
          else
            BASE_REF=origin/main
          fi
          export BASE_REF
          node tools/check-migrations.mjs

  migrations-and-sql-tests:
    name: Migrate empty PostGIS and run SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      # Disposable container on this runner only. Not a secret: it dies with the job.
      PGTEST_PASSWORD: ci-disposable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Database.ts and migrate.ts insist on TLS verified against src/certs/prod-ca-2021.crt.
      # On this throwaway runner only, swap in a CA we generate, so the real code path is tested.
      - name: Start PostGIS 15 (production major version) with TLS
        run: |
          set -euo pipefail
          mkdir pgcerts && cd pgcerts
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=ci-ca' -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > san.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -extfile san.cnf -out server.crt
          sudo chown 999:999 server.key server.crt
          sudo chmod 600 server.key
          cd ..
          docker run -d --name pgtest -p 5432:5432 \
            -e POSTGRES_PASSWORD="$PGTEST_PASSWORD" -e POSTGRES_DB=dfence_test \
            -v "$PWD/pgcerts/server.crt:/var/lib/postgresql/server.crt:ro" \
            -v "$PWD/pgcerts/server.key:/var/lib/postgresql/server.key:ro" \
            postgis/postgis:15-3.4 \
            -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
          for _ in $(seq 1 30); do
            if docker exec pgtest pg_isready -h 127.0.0.1 -U postgres -d dfence_test > /dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec pgtest pg_isready -h 127.0.0.1 -U postgres -d dfence_test
          cp pgcerts/ca.crt src/certs/prod-ca-2021.crt
      - name: Apply every migration from an empty database
        env:
          DATABASE_URL: postgresql://postgres:${{ env.PGTEST_PASSWORD }}@localhost:5432/dfence_test
        run: |
          set -o pipefail
          npx tsx src/tools/migrate.ts | tee migrate.log
      - name: Run the SQL tests that normal CI skips
        env:
          DATABASE_URL: postgresql://postgres:${{ env.PGTEST_PASSWORD }}@localhost:5432/dfence_test
          DFENCE_TEST_LIVE_DB: 'true'
        run: npx vitest run tests/repository.test.ts --reporter=default
      - name: Summarise
        if: always()
        run: |
          {
            echo '## SQL tests'
            echo "Migrations applied to an empty PostGIS 15 database: $(grep -c '^  + ' migrate.log || true)"
            echo 'Repository tests ran with DFENCE_TEST_LIVE_DB=true against the disposable database only.'
          } >> "$GITHUB_STEP_SUMMARY"

  test-and-package:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DFENCE_TEST_LIVE_DB: 'false'
      DATABASE_URL: ''
      TELEGRAM_BOT_TOKEN: ''
      SUPABASE_URL: ''
      SUPABASE_SERVICE_KEY: ''
      ONE_MAP_EMAIL: ''
      ONE_MAP_PASSWORD: ''
      ONE_MAP_TOKEN: ''
      DFENCE_VISION_API_KEY: ''
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      server_sha256: ${{ steps.package.outputs.server_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Reject tracked environment files
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const paths = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0');
          const bad = paths.filter((path) => /^\.env(?:\.|$)/.test(path.split('/').at(-1) ?? '') && !path.endsWith('.example'));
          if (bad.length) throw new Error('Environment files must never be committed: ' + bad.join(', '));
          JS
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Client performance tests inspect the real build output.
      - name: Build
        run: npm run build
      - name: Test without production services
        run: npm test
      - name: Package runtime dependencies and verify ZIP
        id: package
        run: node tools/package-release.mjs
      - name: Smoke-test a clean release extraction
        run: node tools/smoke-release.mjs
      - name: Retain the checked release
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dfence-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scratchpad/ci-release/deploy.zip
            scratchpad/ci-release/release-manifest.json
            scratchpad/ci-release/archive.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    name: Deploy production
    needs: [test-and-package, migrations-and-sql-tests, migration-guard, workflow-lint]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: dfence-production
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.test-and-package.outputs.archive_sha256 }}
      EXPECTED_SERVER_SHA256: ${{ needs.test-and-package.outputs.server_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check Azure identity configuration
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.test-and-package.outputs.artifact_id }}
          path: scratchpad/ci-release
          merge-multiple: true
      - name: Verify the exact tested archive
        run: node tools/package-release.mjs --verify scratchpad/ci-release/deploy.zip "$EXPECTED_ARCHIVE_SHA256"
      - name: Azure login with short-lived GitHub identity
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the checked ZIP
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: scratchpad/ci-release/deploy.zip
      - name: Restart to load the new server
        run: az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --only-show-errors
      - name: Check live health
        run: |
          deadline=$((SECONDS + 300))
          attempts=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempts=$((attempts + 1))
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/api/health" > /dev/null; then
              echo 'Live health check passed.'
              echo "Health: OK after ${attempts} attempt(s)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::The app did not become healthy within five minutes.'
          echo "Health: FAILED after ${attempts} attempt(s). Production may be down." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Match the served client to the checked build
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const { entries } = JSON.parse(readFileSync('scratchpad/ci-release/release-manifest.json', 'utf8'));
          const prefix = 'dist/client/dist/';
          const served = entries.filter(({ path }) => path.startsWith(prefix) && !path.slice(prefix.length).includes('/'));
          if (served.length === 0) throw new Error('The release manifest lists no client files.');
          const stale = [];
          for (const { path, sha256 } of served) {
            const name = path.slice(prefix.length);
            const response = await fetch(`https://${process.env.AZURE_WEBAPP_NAME}.azurewebsites.net/${name}`, { cache: 'no-store' });
            const actual = createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
            if (!response.ok || actual !== sha256) stale.push(name);
          }
          if (stale.length > 0) throw new Error(`Live client files differ from the tested build: ${stale.join(', ')}`);
          console.log(`Verified ${served.length} live client files.`);
          JS
      - name: Match the deployed server to the checked build
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const code = 'const fs=require("fs"),crypto=require("crypto");console.log(crypto.createHash("sha256").update(fs.readFileSync("dist/src/server.mjs")).digest("hex"))';
          const command = 'node -e "eval(Buffer.from(\'' + Buffer.from(code).toString('base64') + '\',\'base64\').toString())"';
          writeFileSync('scratchpad/ci-release/hash-command.json', JSON.stringify({ command, dir: '/home/site/wwwroot' }));
          JS
          remote_hash=$(az rest --method post --url "https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net/api/command" --resource https://management.azure.com/ --headers Content-Type=application/json --body @scratchpad/ci-release/hash-command.json --query Output --output tsv | tr -d '\r\n ')
          if [ "$remote_hash" != "$EXPECTED_SERVER_SHA256" ]; then
            echo '::error::Deployed server hash does not match the tested artifact.'
            exit 1
          fi
          echo "Verified server SHA256: $remote_hash"
          {
            echo '## Deploy'
            echo "Deployed commit ${GITHUB_SHA} to ${AZURE_WEBAPP_NAME}. Server hash matches the tested build."
            echo 'Migrations are NOT applied by CI. Apply any new ones by hand (see the Migrations section of the guard job).'
          } >> "$GITHUB_STEP_SUMMARY"
